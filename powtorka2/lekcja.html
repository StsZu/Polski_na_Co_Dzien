<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Powtórka · Polski krok po kroku 2</title>
<style>
:root{
  --bg:#f6f3ec;--card:#ffffff;--soft:#faf8f3;--ink:#2c2e33;--mut:#7a7f8a;
  --line:#e7e2d6;--acc:#d6455a;--acc2:#3a6ea5;--ok:#2f9e44;--bad:#e03131;--warn:#e8920c;
  --shadow:0 2px 10px rgba(60,50,30,.06);
}
html[data-theme="dark"]{
  --bg:#121316;--card:#1e2127;--soft:#242830;--ink:#d8dbe0;--mut:#9aa0ab;
  --line:#2d323c;--acc:#e55b6e;--acc2:#6ba2d6;--ok:#37b24d;--bad:#f03e3e;--warn:#fcc419;
  --shadow:0 4px 20px rgba(0,0,0,.35);
}
html[data-theme="dark"] .cb{color:#fff}
.themebtn{font-family:Roboto,sans-serif;float:right;margin:2px 12px 0 0;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:20px;width:34px;height:34px;cursor:pointer;font-size:15px;line-height:1}
.themebtn:hover{border-color:var(--acc)}
*{box-sizing:border-box}
body{margin:0;font:17px/1.65 "Iowan Old Style",Georgia,"Segoe UI",Roboto,serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:20;background:#fffefbf2;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:15px 22px}
header .num{display:inline-block;background:var(--acc);color:#fff;font-weight:700;border-radius:8px;padding:3px 12px;margin-right:11px;font-family:Roboto,sans-serif}
header h1{font-size:21px;margin:0;display:inline;font-weight:700}
header .goal{font-size:14px;color:var(--mut);margin-top:7px;font-family:"Segoe UI",Roboto,sans-serif}
header .back{font-family:Roboto,sans-serif;font-size:12.5px;color:var(--acc2);text-decoration:none;float:right;margin-top:4px}
.wrap{max-width:860px;margin:0 auto;padding:24px 22px 60px}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin:0 0 20px;box-shadow:var(--shadow)}
section>h2{font-family:Roboto,"Segoe UI",sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--acc);margin:0 0 4px;display:flex;align-items:center;gap:9px;font-weight:700}
section>h2 .tag{background:#f1ece0;color:var(--mut);font-weight:600;border-radius:6px;padding:2px 8px;font-size:11px;letter-spacing:.3px}
section>.sub{color:var(--mut);font-size:14px;margin:0 0 16px;font-family:"Segoe UI",Roboto,sans-serif}
.blockhdr{font-family:Roboto,sans-serif;font-size:13px;color:var(--acc2);font-weight:700;margin:18px 0 9px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.blockhdr:first-of-type{margin-top:4px}
.voc-group{margin-bottom:18px}
.voc-group h3{font-family:Roboto,sans-serif;font-size:14px;color:var(--acc2);margin:0 0 10px;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{perspective:700px;height:78px;cursor:pointer}
.ci{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flip .ci{transform:rotateY(180deg)}
.cf,.cb{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;text-align:center}
.cf{background:var(--soft);border:1px solid var(--line)}
.cf .pl{font-weight:700;font-size:18px}
.cf .hint{font-size:10px;color:var(--mut);margin-top:3px;font-family:Roboto,sans-serif;text-transform:uppercase;letter-spacing:.5px}
.cb{background:var(--acc2);color:#fff;transform:rotateY(180deg)}
.cb .uk{font-weight:600;font-size:17px;font-family:"Segoe UI",sans-serif}
.revealall{font-family:Roboto,sans-serif;font-size:12.5px;color:var(--acc2);background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;margin-bottom:14px}
.revealall:hover{border-color:var(--acc2)}
.dia{background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:14px}
.dia .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dia .h b{font-family:Roboto,sans-serif;font-size:13.5px;color:var(--acc)}
.line{margin:5px 0}
.line .who{color:var(--acc2);font-weight:600;display:inline-block;min-width:118px;font-family:"Segoe UI",sans-serif;font-size:15px;vertical-align:top}
.tr{display:none;color:var(--mut);font-size:15px;padding-left:118px;font-style:italic}
.dia.show .tr{display:block}
.aud{width:100%;height:34px;margin-top:10px;display:block}
.mono{background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:14px}
.mono .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mono .h b{font-family:Roboto,sans-serif;font-size:13.5px;color:var(--acc)}
.mono .pl{font-size:16.5px}
.mono .tr{display:none;color:var(--mut);font-size:15px;font-style:italic;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.mono.show .tr{display:block}
.gtable{width:100%;border-collapse:collapse;font-size:15px;margin:4px 0 6px;font-family:"Segoe UI",Roboto,sans-serif}
.gtable th{text-align:left;font-family:Roboto,sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);padding:7px 10px;border-bottom:2px solid var(--line)}
.gtable td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.gtable em,.gcard .note em,.gcard .words em{color:var(--acc);font-style:normal;font-weight:800}
.gcard .hl,.gtable .hl{color:var(--acc);font-weight:800}
.gcard{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.gcard h4{font-family:Roboto,sans-serif;color:var(--acc);font-size:15.5px;margin:0 0 8px}
.gcard .note{font-size:14px;color:var(--mut);font-family:"Segoe UI",sans-serif;margin:2px 0 8px}
.gcard .words{font-size:15.5px;line-height:1.7}
.fb{display:none;margin-top:14px;background:#eef4fb;border:1px solid #d8e6f4;border-radius:10px;padding:11px 14px;font-size:14.5px;color:var(--ink);font-family:"Segoe UI",Roboto,sans-serif}
.fb.show{display:block}
.fb b{color:var(--acc2)}
.qprog{flex:1;height:6px;background:var(--line);border-radius:10px;overflow:hidden;margin:0 12px}
.qprog .fill{height:100%;width:0;background:var(--acc2);border-radius:10px;transition:width .3s ease}
.qscore{font-family:Roboto,sans-serif;font-size:12px;font-weight:700;color:var(--acc);background:#fdecef;border:1px solid #f3c6cd;border-radius:20px;padding:2px 10px;white-space:nowrap}
html[data-theme="dark"] .qscore{background:rgba(229,91,110,.15);border-color:rgba(229,91,110,.4)}
#wynik .emoji{font-size:46px;line-height:1;margin-bottom:6px}
#wynik .headline{font-family:Roboto,sans-serif;font-size:17px;font-weight:700;margin:4px 0 2px}
.checklist{display:flex;flex-direction:column;gap:12px}
.chk{display:flex;align-items:flex-start;gap:11px;cursor:pointer;background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.chk:hover{border-color:var(--acc)}
.chk .box{width:22px;height:22px;border:2px solid var(--line);border-radius:6px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;margin-top:1px}
.chk.on .box{background:var(--ok);border-color:var(--ok)}
.chk .ctext{font-weight:600;font-size:16px}
.chk.on .ctext{text-decoration:line-through;color:var(--mut)}
.chk .csub{font-size:13.5px;color:var(--mut);font-family:"Segoe UI",sans-serif;margin-top:2px}
.song-styles{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 12px}
.song-styles .chip{font-family:Roboto,sans-serif;font-size:12px;color:var(--acc2);background:#eef4fb;border:1px solid #d8e6f4;border-radius:20px;padding:3px 11px}
html[data-theme="dark"] .song-styles .chip{background:rgba(107,162,214,.14);border-color:rgba(107,162,214,.35)}
.lyrics{display:none;margin-top:12px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-family:"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.7;white-space:pre-wrap}
.lyrics.show{display:block}
.lyrics .lh{display:block;margin:12px 0 3px;font-family:Roboto,sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--acc)}
.lyrics .lh:first-child{margin-top:0}
.drill{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:18px 16px;text-align:center}
.drill .task{font-size:17px;font-weight:600;min-height:50px;display:flex;align-items:center;justify-content:center;padding:0 8px}
.drill .ans{display:none;background:#eef4fb;border:1px solid #d8e6f4;border-radius:9px;padding:11px;font-size:17px;color:var(--acc2);font-weight:700;margin:12px 0}
html[data-theme="dark"] .drill .ans{background:rgba(107,162,214,.12);border-color:rgba(107,162,214,.35)}
.drill .ans.show{display:block}
.drill .ans .dhint{font-size:13.5px;font-weight:400;color:var(--mut);font-style:italic;margin-top:6px;font-family:"Segoe UI",sans-serif}
.drill .ctrls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.drill button{font-family:Roboto,sans-serif;border-radius:9px;padding:10px 18px;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.drill button.primary{background:var(--acc2);color:#fff;border-color:var(--acc2)}
.drill button:disabled{opacity:.4;cursor:not-allowed}
.btn{font-family:Roboto,sans-serif;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 13px;font-size:12.5px;cursor:pointer}
.btn:hover{border-color:var(--acc)}
.reflist{background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:14px}
.reflist b{font-family:Roboto,sans-serif;font-size:13.5px;color:var(--acc);display:block;margin-bottom:7px}
.reflist .words{font-size:16px}
.reflist .uk{color:var(--mut);font-style:italic;font-size:14.5px;margin-top:6px;font-family:"Segoe UI",sans-serif}
.formulas{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.fcard{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:15px 16px;position:relative}
.fcard .badge{position:absolute;top:11px;right:12px;font-family:Roboto,sans-serif;font-size:10px;color:var(--acc2);background:#eef4fb;border:1px solid #d8e6f4;border-radius:5px;padding:1px 7px}
.fcard h4{font-family:Roboto,sans-serif;color:var(--acc);font-size:16px;margin:0 0 10px}
.fcard .formula{font-weight:700;font-size:17px;background:#fff;border:1px dashed var(--line);border-radius:7px;padding:7px 9px;margin-bottom:8px;text-align:center}
.fcard .ex{font-size:13.5px;color:var(--mut);font-family:"Segoe UI",sans-serif}
.alfa{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.alfa-card{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center}
.alfa-card .ltr{font-family:Roboto,sans-serif;font-weight:800;font-size:20px;color:var(--acc2)}
.alfa-card .ex{font-size:14.5px;font-weight:600;margin-top:3px}
.alfa-card .uk{font-size:12px;color:var(--mut);margin-top:2px;font-family:"Segoe UI",sans-serif}
.manifests{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.manifests{grid-template-columns:1fr}}
.mcard{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px 16px;position:relative}
.mcard .nat{position:absolute;top:12px;right:13px;font-family:Roboto,sans-serif;font-size:10px;color:var(--warn);border:1px solid #f0d6a8;border-radius:5px;padding:1px 7px}
.mcard h4{font-family:Roboto,sans-serif;color:var(--acc);font-size:16px;margin:0 0 11px}
.mrow{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:5px 0;font-size:14px}
.mrow:last-child{border-bottom:none}
.mrow .l{color:var(--mut)}.mrow .v{font-weight:600}
.builder{margin-top:16px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:15px 16px}
.builder h3{font-family:Roboto,sans-serif;font-size:13px;color:var(--acc2);margin:0 0 11px;text-transform:none}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.bgrid{grid-template-columns:1fr}}
.bgrid label{font-family:Roboto,sans-serif;font-size:11px;color:var(--mut);display:block;margin-bottom:4px}
.bgrid input{width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:15px;color:var(--ink);font-family:"Segoe UI",sans-serif}
.bgrid input:focus{outline:none;border-color:var(--acc2)}
.bresult{margin-top:13px;background:#eef4fb;border:1px solid #d8e6f4;border-radius:9px;padding:12px;font-size:16px;color:var(--ink);text-align:center;font-weight:600}
.mistakes{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:18px;font-family:"Segoe UI",sans-serif}
.mistakes th{text-align:left;font-family:Roboto,sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);padding:8px 10px;border-bottom:2px solid var(--line)}
.mistakes td{padding:10px;border-bottom:1px solid var(--line)}
.bad-b{background:#fdecec;color:var(--bad);border:1px solid #f3b9b9;border-radius:5px;padding:2px 8px;font-size:13.5px;text-decoration:line-through}
.ok-b{background:#eafaef;color:var(--ok);border:1px solid #b7e6c4;border-radius:5px;padding:2px 8px;font-size:13.5px}
.mistakes .why{color:var(--mut);font-size:13px}
.drill{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:18px 16px;text-align:center}
.drill .task{font-size:17px;font-weight:600;min-height:50px;display:flex;align-items:center;justify-content:center;padding:0 8px}
.drill .ans{display:none;background:#eef4fb;border:1px solid #d8e6f4;border-radius:9px;padding:11px;font-size:17px;color:var(--acc2);font-weight:700;margin:12px 0}
.drill .ans.show{display:block}
.drill .ctrls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.drill button{font-family:Roboto,sans-serif;border-radius:9px;padding:10px 18px;font-size:14px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
.drill button.primary{background:var(--acc2);color:#fff;border-color:var(--acc2)}
.drill button:disabled{opacity:.4;cursor:not-allowed}
#quizwrap{font-family:"Segoe UI",Roboto,sans-serif}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:#e3ddcf}
.dot.cur{background:var(--acc2)}.dot.ok{background:var(--ok)}.dot.no{background:var(--bad)}
.qtopic{font-family:Roboto,sans-serif;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.qcard{min-height:240px}
.qt{font-weight:600;font-size:18px;margin:6px 0 16px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:11px;background:var(--soft);border:1.5px solid var(--line);border-radius:11px;padding:11px 15px;cursor:pointer;transition:.12s;font-size:16px}
.opt:hover{border-color:var(--acc2)}
.opt.sel{border-color:var(--acc2);background:#eef4fb}
.opt.correct{border-color:var(--ok);background:#eafaef}
.opt.wrong{border-color:var(--bad);background:#fdecec}
.opt .mk{width:20px;height:20px;border-radius:50%;border:1.5px solid #c9c3b4;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex:0 0 auto}
.opt.sel .mk{background:var(--acc2);border-color:var(--acc2)}
.opt.correct .mk{background:var(--ok);border-color:var(--ok)}
.opt.wrong .mk{background:var(--bad);border-color:var(--bad)}
.opts.locked .opt{cursor:default}
.qnav{display:flex;justify-content:flex-end;margin-top:18px}
.next{font-family:Roboto,sans-serif;background:var(--acc2);color:#fff;border:none;border-radius:10px;padding:11px 26px;font-size:15px;font-weight:600;cursor:pointer}
.next:disabled{opacity:.35;cursor:not-allowed}
#wynik{display:none;text-align:center}
#wynik.show{display:block}
#wynik .big{font-size:42px;font-weight:800;font-family:Roboto,sans-serif}
#wynik .big.good{color:var(--ok)}#wynik .big.mid{color:var(--warn)}#wynik .big.low{color:var(--bad)}
#wynik .rev{margin-top:10px;color:var(--mut);font-size:15px;font-family:"Segoe UI",sans-serif}
#wynik .rev b{color:var(--ink)}
.again{font-family:Roboto,sans-serif;margin-top:16px;background:none;border:1px solid var(--line);border-radius:9px;padding:9px 18px;cursor:pointer;color:var(--acc2)}
.src{font-size:12.5px;color:var(--mut);margin-top:8px;font-family:"Segoe UI",sans-serif}
.src a{color:var(--acc2);text-decoration:none}
.load{max-width:860px;margin:60px auto;padding:0 22px;font-family:"Segoe UI",sans-serif;color:var(--mut)}
.load code{background:#ece7da;padding:2px 6px;border-radius:5px;color:var(--ink)}
</style>
</head>
<body>
<header>
  <button class="themebtn" id="themebtn" title="Світла / темна тема">🌙</button>
  <a class="back" href="index.html">← усі уроки</a>
  <span class="num" id="hNum">··</span><h1 id="hTitle">Завантаження…</h1>
  <div class="goal" id="hGoal"></div>
</header>
<div class="wrap" id="wrap"></div>

<script>
const $ = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc = s => String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
// inline markup: *…* → highlighted (e.g. grammar endings)
const hl = s => esc(s).replace(/\*([^*]+)\*/g,'<span class="hl">$1</span>');
// theme toggle (persisted)
(function(){
  const saved=localStorage.getItem('pwt-theme');
  if(saved==='dark') document.documentElement.setAttribute('data-theme','dark');
  const set=()=>{const d=document.documentElement.getAttribute('data-theme')==='dark';const b=document.getElementById('themebtn');if(b)b.textContent=d?'☀️':'🌙';};
  document.addEventListener('DOMContentLoaded',()=>{
    const b=document.getElementById('themebtn'); if(!b)return; set();
    b.onclick=()=>{const d=document.documentElement.getAttribute('data-theme')==='dark';
      if(d){document.documentElement.removeAttribute('data-theme');localStorage.setItem('pwt-theme','light');}
      else{document.documentElement.setAttribute('data-theme','dark');localStorage.setItem('pwt-theme','dark');}
      set();};
  });
})();
function getId(){const p=new URLSearchParams(location.search).get('id');return (p||'01').padStart(2,'0');}

function section(tag,title){
  const s=$('section');
  s.appendChild($('h2',null,`${esc(title)} ${tag?`<span class="tag">${esc(tag)}</span>`:''}`));
  return s;
}
function sub(s,t){s.appendChild($('p','sub',esc(t)));return s;}

function audioEl(src){const a=$('audio','aud');a.controls=true;a.preload='none';a.src=src;return a;}
function dialogEl(d){
  const el=$('div','dia');
  const h=$('div','h'); h.appendChild($('b',null,esc(d.title)));
  const btn=$('button','btn','переклад'); btn.onclick=()=>el.classList.toggle('show');
  h.appendChild(btn); el.appendChild(h);
  d.lines.forEach(([who,pl,uk])=>{
    el.appendChild($('div','line',`<span class="who">${esc(who)}</span>${esc(pl)}`));
    if(uk) el.appendChild($('div','tr',esc(uk)));
  });
  if(d.audio) el.appendChild(audioEl(d.audio));
  return el;
}
function refEl(r){
  const el=$('div','reflist');
  el.appendChild($('b',null,esc(r.title)));
  el.appendChild($('div','words',esc(r.words)));
  if(r.note) el.appendChild($('div','uk',esc(r.note)));
  if(r.audio) el.appendChild(audioEl(r.audio));
  return el;
}
function monoEl(m){
  const el=$('div','mono');
  const h=$('div','h'); h.appendChild($('b',null,esc(m.title)));
  const btn=$('button','btn','переклад'); btn.onclick=()=>el.classList.toggle('show');
  h.appendChild(btn); el.appendChild(h);
  el.appendChild($('div','pl',esc(m.text)));
  if(m.tr) el.appendChild($('div','tr',esc(m.tr)));
  if(m.audio) el.appendChild(audioEl(m.audio));
  return el;
}
function czItem(it){
  if(it.type==='ref') return refEl(it);
  if(it.type==='mono') return monoEl(it);
  return dialogEl(it);
}

function render(d){
  document.title=`Powtórka · Lekcja ${d.id} — ${d.title}`;
  document.getElementById('hNum').textContent=d.id;
  document.getElementById('hTitle').textContent=d.title;
  document.getElementById('hGoal').textContent=d.goal||'';
  const wrap=document.getElementById('wrap');

  /* SŁOWNICTWO */
  if(d.vocab&&d.vocab.length){
    const s=section('картки','Słownictwo');
    sub(s,'Прочитай польське слово й пригадай переклад. Натисни картку, щоб перевірити себе.');
    const btn=$('button','revealall','Показати / сховати всі переклади');
    let allShown=false;
    btn.onclick=()=>{allShown=!allShown;s.querySelectorAll('.card').forEach(c=>c.classList.toggle('flip',allShown));};
    s.appendChild(btn);
    d.vocab.forEach(g=>{
      const grp=$('div','voc-group'); grp.appendChild($('h3',null,esc(g.group)));
      const cards=$('div','cards');
      g.items.forEach(([pl,uk])=>{
        const c=$('div','card',`<div class="ci"><div class="cf"><div class="pl">${esc(pl)}</div><div class="hint">перевір</div></div><div class="cb"><div class="uk">${esc(uk)}</div></div></div>`);
        c.onclick=()=>c.classList.toggle('flip'); cards.appendChild(c);
      });
      grp.appendChild(cards); s.appendChild(grp);
    });
    wrap.appendChild(s);
  }

  /* PRZEDSTAWIANIE SIĘ / formuły */
  if(d.formulas&&d.formulas.length){
    const s=section('шаблони','Wzory / Konstrukcje');
    sub(s,'Ключові конструкції уроку. Зверни увагу на закінчення.');
    const grid=$('div','formulas');
    d.formulas.forEach(f=>{
      grid.appendChild($('div','fcard',
        `<span class="badge">${esc(f.badge||'')}</span><h4>${esc(f.title)}</h4>`+
        `<div class="formula">${esc(f.formula)}</div><div class="ex">${esc(f.ex||'')}</div>`));
    });
    s.appendChild(grid); wrap.appendChild(s);
  }

  /* ALFABET */
  if(d.alfabet&&d.alfabet.length){
    const s=section('складні звуки','Alfabet · wymowa');
    sub(s,'Літери та звуки, яких немає в українській. Прочитай приклад уголос; у дужках — приблизна вимова.');
    const grid=$('div','alfa');
    d.alfabet.forEach(([l,ex,uk])=>grid.appendChild($('div','alfa-card',
      `<div class="ltr">${esc(l)}</div><div class="ex">${esc(ex)}</div><div class="uk">[${esc(uk)}]</div>`)));
    s.appendChild(grid); wrap.appendChild(s);
  }

  /* GRAMATYKA */
  if(d.gramatyka&&d.gramatyka.length){
    const s=section('граматика','Gramatyka');
    sub(s,d.gramatykaSub||'Ключова граматика уроку. Прочитай таблиці й приклади.');
    d.gramatyka.forEach(c=>{
      const g=$('div','gcard'); g.appendChild($('h4',null,esc(c.title)));
      if(c.note) g.appendChild($('div','note',hl(c.note)));
      if(c.table){
        const t=$('table','gtable');
        if(c.table.head){
          t.appendChild($('thead',null,'<tr>'+c.table.head.map(h=>`<th>${esc(h)}</th>`).join('')+'</tr>'));
        }
        const tb=$('tbody');
        c.table.rows.forEach(r=>tb.appendChild($('tr',null,r.map(cell=>`<td>${hl(cell)}</td>`).join(''))));
        t.appendChild(tb); g.appendChild(t);
      }
      if(c.words) g.appendChild($('div','words',hl(c.words)));
      s.appendChild(g);
    });
    wrap.appendChild(s);
  }

  /* CZYTANIE */
  if(d.czytanie&&d.czytanie.length){
    const s=section('підручник · діалоги','Czytanie');
    sub(s,'Спершу прочитай сам уголос. Потім натисни «переклад» і перевір розуміння.');
    d.czytanie.forEach(b=>{
      if(b.block) s.appendChild($('div','blockhdr',esc(b.block)));
      b.items.forEach(it=>s.appendChild(czItem(it)));
    });
    if(d.czytanieSource) s.appendChild($('p','src',esc(d.czytanieSource)));
    wrap.appendChild(s);
  }

  /* ZESZYT */
  if(d.zeszyt&&d.zeszyt.length){
    const s=section('домашнє повторення','Zeszyt ćwiczeń');
    sub(s,'Вправи з робочого зошита (інші персонажі, ті самі теми).');
    d.zeszyt.forEach(it=>s.appendChild(czItem(it)));
    if(d.zeszytSource) s.appendChild($('p','src',esc(d.zeszytSource)));
    wrap.appendChild(s);
  }

  /* DANE OSOBOWE */
  if(d.manifests&&d.manifests.length){
    const s=section('анкета','Dane osobowe');
    sub(s,'Офіційні дані з анкет. Нижче — збери власну картку польською.');
    const row=$('div','manifests');
    d.manifests.forEach(m=>{
      const c=$('div','mcard',`<span class="nat">${esc(m.nat||'')}</span><h4>${esc(m.name)}</h4>`);
      m.rows.forEach(([l,v])=>c.appendChild($('div','mrow',`<span class="l">${esc(l)}</span><span class="v">${esc(v)}</span>`)));
      row.appendChild(c);
    });
    s.appendChild(row);
    const b=$('div','builder','<h3>Збери свою картку польською</h3>');
    const g=$('div','bgrid');
    g.innerHTML=`<div><label>IMIĘ — ім’я</label><input id="bImie"></div>`+
                `<div><label>NAZWISKO — прізвище</label><input id="bNaz"></div>`+
                `<div><label>NARODOWOŚĆ — нац.</label><input id="bNar"></div>`;
    b.appendChild(g);
    const res=$('div','bresult','Впиши дані, і з’явиться фраза…'); b.appendChild(res);
    s.appendChild(b);
    const upd=()=>{
      const im=g.querySelector('#bImie').value.trim(),nz=g.querySelector('#bNaz').value.trim(),nr=g.querySelector('#bNar').value.trim();
      if(!im&&!nz&&!nr){res.textContent='Впиши дані, і з’явиться фраза…';return;}
      const full=(im||nz)?`${im||'…'} ${nz||'…'}`.trim():'…';
      res.textContent=`Mam na imię ${im||'…'}. Nazywam się ${full}. Jestem ${nr||'…'}.`;
    };
    g.querySelectorAll('input').forEach(i=>i.oninput=upd);
    wrap.appendChild(s);
  }

  /* TYPOWE BŁĘDY */
  if(d.mistakes&&d.mistakes.length){
    const s=section('часті помилки','Typowe błędy');
    sub(s,'Порівняй неправильно / правильно — і не повторюй цих помилок.');
    const t=$('table','mistakes','<thead><tr><th>Помилка</th><th>Правильно</th><th>Чому</th></tr></thead>');
    const tb=$('tbody');
    d.mistakes.forEach(([bad,ok,why])=>tb.appendChild($('tr',null,
      `<td><span class="bad-b">${esc(bad)}</span></td><td><span class="ok-b">${esc(ok)}</span></td><td class="why">${esc(why)}</td>`)));
    t.appendChild(tb); s.appendChild(t); wrap.appendChild(s);
  }

  /* MÓW PO POLSKU */
  if(d.drills&&d.drills.length){
    const s=section('усний тренажер','Mów po polsku');
    sub(s,'Прочитай завдання, скажи фразу польською вголос — потім перевір зразок.');
    const dr=$('div','drill');
    const task=$('div','task','Натисни «Нове завдання», щоб почати.');
    const ans=$('div','ans');
    const ctr=$('div','ctrls');
    const bNew=$('button','primary','Нове завдання');
    const bRev=$('button',null,'Показати зразок'); bRev.disabled=true;
    let cur=-1;
    bNew.onclick=()=>{let r=cur;while(r===cur&&d.drills.length>1)r=Math.floor(Math.random()*d.drills.length);if(d.drills.length===1)r=0;cur=r;task.textContent=d.drills[r][0];ans.classList.remove('show');ans.textContent='';bRev.disabled=false;};
    bRev.onclick=()=>{if(cur<0)return;ans.textContent=d.drills[cur][1];ans.classList.add('show');};
    ctr.appendChild(bNew); ctr.appendChild(bRev);
    dr.appendChild(task); dr.appendChild(ans); dr.appendChild(ctr);
    s.appendChild(dr); wrap.appendChild(s);
  }

  /* QUIZ */
  if(d.quiz&&d.quiz.length) renderQuiz(d.quiz,wrap);

  /* MÓW PO POLSKU — усний тренажер */
  if(d.drills&&d.drills.length){
    const s=section('усний тренажер','Mów po polsku');
    sub(s,'Прочитай завдання, скажи фразу польською вголос — потім перевір зразок.');
    const dr=$('div','drill');
    const task=$('div','task','Натисни «Нове завдання», щоб почати.');
    const ans=$('div','ans'); const ctr=$('div','ctrls');
    const bNew=$('button','primary','Нове завдання');
    const bRev=$('button',null,'Показати зразок'); bRev.disabled=true;
    let cur=-1;
    bNew.onclick=()=>{let r=cur;while(r===cur&&d.drills.length>1)r=Math.floor(Math.random()*d.drills.length);if(d.drills.length===1)r=0;cur=r;task.textContent=d.drills[r][0];ans.classList.remove('show');ans.innerHTML='';bRev.disabled=false;};
    bRev.onclick=()=>{if(cur<0)return;const hint=d.drills[cur][2];ans.innerHTML=esc(d.drills[cur][1])+(hint?`<div class="dhint">${esc(hint)}</div>`:'');ans.classList.add('show');};
    ctr.appendChild(bNew); ctr.appendChild(bRev);
    dr.appendChild(task); dr.appendChild(ans); dr.appendChild(ctr);
    s.appendChild(dr); wrap.appendChild(s);
  }

  /* CHECKLIST — підсумок */
  if(d.checklist&&d.checklist.length){
    const s=section('підсумок','Czy już umiem?');
    sub(s,'Познач те, що вже впевнено вмієш після цього уроку.');
    const list=$('div','checklist');
    d.checklist.forEach(it=>{
      const text=typeof it==='string'?it:it.text;
      const subt=typeof it==='string'?'':(it.sub||'');
      const row=$('div','chk',`<div class="box">✓</div><div><div class="ctext">${esc(text)}</div>${subt?`<div class="csub">${esc(subt)}</div>`:''}</div>`);
      row.onclick=()=>row.classList.toggle('on');
      list.appendChild(row);
    });
    s.appendChild(list); wrap.appendChild(s);
  }

  /* PIOSENKA — śpiewaj i zapamiętuj */
  if(d.song&&d.song.audio){
    const s=section('пісня','Piosenka');
    sub(s,'Слухай і підспівуй — так найкраще запамʼятовується. Слова — під плеєром.');
    if(d.song.styles&&d.song.styles.length){
      const st=$('div','song-styles');
      d.song.styles.forEach(t=>st.appendChild($('span','chip',esc(t))));
      s.appendChild(st);
    }
    s.appendChild(audioEl(d.song.audio));
    if(d.song.lyrics){
      const btn=$('button','btn','Słowa piosenki'); s.appendChild(btn);
      const ly=$('div','lyrics');
      ly.innerHTML=esc(d.song.lyrics).split('\n')
        .map(ln=>/^\[.*\]$/.test(ln.trim())?`<span class="lh">${ln.trim()}</span>`:ln).join('\n');
      btn.onclick=()=>ly.classList.toggle('show');
      s.appendChild(ly);
    }
    wrap.appendChild(s);
  }
}

function renderQuiz(Q,wrap){
  const s=section(`${Q.length} завдань`,'Quiz');
  sub(s,'Обери відповідь — і одразу побачиш, правильно чи ні. Тисни «Далі».');
  const qw=$('div'); qw.id='quizwrap';
  qw.innerHTML=`<div class="qhead"><span class="qtopic" id="qtopic"></span><div class="qprog"><div class="fill" id="qfill"></div></div><span class="qscore" id="qscore">0 / ${Q.length}</span></div>`+
    `<div class="dots" id="dots"></div>`+
    `<div class="qcard"><div class="qt" id="qt"></div><div class="opts" id="opts"></div><div class="fb" id="fb"></div></div>`+
    `<div class="qnav"><button class="next" id="next" disabled>Далі</button></div>`;
  s.appendChild(qw);
  const wy=$('div'); wy.id='wynik';
  wy.innerHTML=`<div class="emoji" id="emoji"></div><div class="headline" id="headline"></div><div class="big" id="bigscore">—</div><div class="rev" id="review"></div>`+
    `<button class="again">Пройти ще раз</button>`;
  s.appendChild(wy); wrap.appendChild(s);
  wy.querySelector('.again').onclick=()=>location.reload();

  let i=0,score=0,answered=false; const wrong={};
  const dotsEl=qw.querySelector('#dots'); Q.forEach(()=>dotsEl.appendChild($('div','dot')));
  const nextBtn=qw.querySelector('#next'); nextBtn.onclick=()=>{ if(i<Q.length-1){i++;show();} else finish(); };

  function show(){
    answered=false;
    qw.querySelector('#qtopic').textContent=`Завдання ${i+1} / ${Q.length} · ${Q[i].topic||''}`;
    qw.querySelector('#qt').textContent=Q[i].q;
    [...dotsEl.children].forEach((dt,k)=>dt.classList.toggle('cur',k===i));
    const fill=qw.querySelector('#qfill'); if(fill) fill.style.width=Math.round(((i+1)/Q.length)*100)+'%';
    const fb=qw.querySelector('#fb'); fb.className='fb'; fb.innerHTML='';
    const opts=qw.querySelector('#opts'); opts.className='opts'; opts.innerHTML='';
    Q[i].o.forEach((c,j)=>{
      const o=$('div','opt',`<span class="mk"></span><span>${esc(c)}</span>`);
      o.onclick=()=>choose(j,opts); opts.appendChild(o);
    });
    nextBtn.disabled=true; nextBtn.textContent = i===Q.length-1?'Підсумок':'Далі';
  }
  function choose(j,opts){
    if(answered)return; answered=true; opts.classList.add('locked');
    const a=Q[i].a;
    [...opts.children].forEach((c,k)=>{
      if(k===a){c.classList.add('correct');c.querySelector('.mk').textContent='✓';}
      if(k===j&&j!==a){c.classList.add('wrong');c.querySelector('.mk').textContent='✗';}
    });
    if(j===a){score++;dotsEl.children[i].classList.add('ok');}
    else{wrong[Q[i].topic||'тема']=true;dotsEl.children[i].classList.add('no');}
    const sc=qw.querySelector('#qscore'); if(sc) sc.textContent=`${score} / ${Q.length}`;
    if(Q[i].fb){const fb=qw.querySelector('#fb');fb.innerHTML=`<b>${j===a?'✓ Правильно. ':'✗ '}</b>${esc(Q[i].fb)}`;fb.classList.add('show');}
    nextBtn.disabled=false;
  }
  function finish(){
    qw.style.display='none'; wy.classList.add('show');
    const big=wy.querySelector('#bigscore');
    big.textContent=`${score} / ${Q.length}`;
    const pct=score/Q.length;
    big.className='big '+(pct>=0.9?'good':pct>=0.6?'mid':'low');
    const tier = pct>=0.9?['🏆','Чудово! Матеріал засвоєно.']
               : pct>=0.6?['🥈','Добрий результат — ще трохи повторити.']
               : ['📚','Варто повторити урок.'];
    wy.querySelector('#emoji').textContent=tier[0];
    wy.querySelector('#headline').textContent=tier[1];
    const t=Object.keys(wrong);
    wy.querySelector('#review').innerHTML = t.length===0
      ? 'Чудово! Усе правильно — можна переходити далі.'
      : 'Варто повторити: <b>'+t.join('</b>, <b>')+'</b>.';
  }
  show();
}

const id=getId();
fetch(`data/lekcja-${id}.json`)
  .then(r=>{if(!r.ok)throw 0;return r.json();})
  .then(render)
  .catch(()=>{
    document.getElementById('hTitle').textContent='Не вдалося завантажити урок';
    document.getElementById('wrap').innerHTML=
      `<div class="load">Не знайдено <code>data/lekcja-${id}.json</code>, або сторінку відкрито через <code>file://</code> ` +
      `(браузер блокує fetch). Запусти локальний сервер у папці <code>powtorka2/</code>:<br><br>` +
      `<code>python3 -m http.server 8000</code><br><br>і відкрий <code>http://localhost:8000/lekcja.html?id=${id}</code>. ` +
      `На GitHub Pages усе працює без сервера.</div>`;
  });
</script>
