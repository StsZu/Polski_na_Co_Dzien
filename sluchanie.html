<html lang="pl">
<head>

  <style>
    :root {
      --bg-body: #e7dfd2;

      --border-hover: #b8a891;
      --text-main: #2f2822;
      --text-muted: #7a6858;
      --text-descr: #4a3e34;
      --btn-bg: rgba(255, 251, 244, 0.9);
      --btn-hover: #efe6d8;

      --shadow-sm: 0 2px 8px rgba(74, 62, 52, 0.04);
      --shadow-md: 0 6px 20px rgba(74, 62, 52, 0.06);
      --transition-speed: 0.3s;
      --font-serif: Georgia, "Palatino Linotype", serif;
      --font-sans: "SF Pro Text", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    }

    .night-mode {
      --bg-body: #14110f;
      --bg-card: #1f1b18;
      --bg-card-hover: #26211d;
      --border-color: #38302b;
      --border-hover: #52473f;
      --text-main: #f3eae1;
      --text-muted: #9e8d80;
      --text-descr: #cfc2b6;
      --btn-bg: #2b2420;
      --btn-hover: #3b322c;
      --accent: #ff4d5a;
      --accent-light: rgba(255, 77, 90, 0.15);
      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-serif);
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      padding: 40px 20px;
      line-height: 1.55;
      transition: background-color var(--transition-speed) ease, color var(--transition-speed) ease;
    }

    button, a, audio { font-family: var(--font-sans); }

    .module { width: 100%; max-width: 880px; margin: 0 auto; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding: 0 4px;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
    .back:hover { color: var(--accent); }

    .theme-toggle-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 9px 15px;
      border-radius: 30px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-sm);
      transition: all var(--transition-speed) ease;
    }
    .theme-toggle-btn:hover { border-color: var(--border-hover); background: var(--bg-card-hover); transform: translateY(-1px); }
    .theme-toggle-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }

    .header {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 22px;
      padding: 34px 38px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 5px; height: 100%;
      background: var(--accent);
    }
    .title { font-size: 32px; line-height: 1.2; margin-bottom: 8px; font-weight: 800; }
    .subtitle { font-size: 17px; color: var(--text-muted); line-height: 1.5; }

    .song-list { display: flex; flex-direction: column; gap: 18px; }

    .song {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 22px;
      box-shadow: var(--shadow-sm);
      scroll-margin-top: 20px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .song:hover { border-color: var(--border-hover); box-shadow: var(--shadow-md); }

    .song-head { display: flex; gap: 18px; align-items: flex-start; }

    .cover {
      width: 64px;
      height: 64px;
      flex-shrink: 0;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      background: var(--accent-light);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-sans);
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -0.5px;
    }

    .song-meta { flex: 1; min-width: 0; }
    .song-title { font-size: 21px; font-weight: 700; line-height: 1.25; margin-bottom: 4px; }
    .song-artist { font-family: var(--font-sans); font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
    .song-topic {
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--accent);
      background: var(--accent-light);
      display: inline-block;
      padding: 4px 12px;
      border-radius: 100px;
      line-height: 1.4;
    }

    .song audio { width: 100%; margin-top: 16px; }

    .song-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .song-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--btn-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-main);
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .song-btn:hover { background: var(--btn-hover); border-color: var(--border-hover); }

    .lyrics {
      display: none;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--border-color);
      white-space: pre-wrap;
      font-family: var(--font-serif);
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-descr);
    }
    .lyrics.is-open { display: block; }

    @media (max-width: 560px) {
      body { padding: 24px 12px; }
      .header { padding: 26px 22px; }
      .title { font-size: 27px; }
      .song-head { gap: 14px; }
      .cover { width: 52px; height: 52px; font-size: 16px; }
      .song-title { font-size: 19px; }
    }
  </style>
</head>

      const num = i + 1;
      article.innerHTML = `
        <div class="song-head">
          <div class="cover" aria-hidden="true">L${num}</div>

        </div>
        <div class="lyrics" id="lyrics-${i}">${s.lyrics.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</div>
      `;
      list.appendChild(article);
    });

    list.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-lyrics]");
      if (!btn) return;
      const box = document.getElementById("lyrics-" + btn.dataset.lyrics);
      const open = box.classList.toggle("is-open");
      btn.setAttribute("aria-expanded", String(open));
      btn.textContent = open ? "Ukryj transkrypcję" : "Pokaż transkrypcję";
    });

    function toggleTheme() {
      const body = document.body;
      const isNight = body.classList.toggle('night-mode');
      document.getElementById('sunIcon').style.display = isNight ? 'none' : 'block';
      document.getElementById('moonIcon').style.display = isNight ? 'block' : 'none';
      document.getElementById('themeBtnText').innerText = isNight ? 'Daylight' : 'Night Ops';
      localStorage.setItem('theme', isNight ? 'night' : 'day');
    }

    window.onload = function() {
      if (localStorage.getItem('theme') === 'night') {
        document.body.classList.add('night-mode');
        document.getElementById('sunIcon').style.display = 'none';
        document.getElementById('moonIcon').style.display = 'block';
        document.getElementById('themeBtnText').innerText = 'Daylight';
      }
      if (location.hash) {
        const el = document.getElementById(location.hash.slice(1));
        if (el) el.scrollIntoView();
      }
    };
  </script>
